# ============================================================
# 美柚 Meiyou 开屏/广告屏蔽 — 独立订阅（不影响任何其他 App）
# 本配置只作用于 *.meiyou.com，与其他订阅(含开屏大杂烩)并存互不干扰
# 配套脚本: https://raw.githubusercontent.com/fdkdk/adb/main/meiyou_ads.js
# 订阅地址: https://raw.githubusercontent.com/fdkdk/adb/main/MeiyouAds.conf
# 使用: QX → 重写 → 引用(订阅) → + → 类型选「配置文件」→ 填上面订阅地址 → 保存
# 注意: 若你已在 StartUp_NoWeibo.conf 里配置过美柚，建议把它从那里移除避免重复
#       （那份大杂烩已抽掉美柚段，本文件独立负责美柚）
# ============================================================

[mitm]
hostname = *.meiyou.com

[filter_local]
# === 字节系广告 SDK(从用户手机 QX 「网络活动」面板实际抓到的广告源) ===
# volces.com = 字节跳动 火山引擎 Volcengine 顶级域名
# mssdk.volces.com = 字节系 移动监测/广告归因 SDK，几乎所有接入字节广告的 App 都会走这里
host-suffix, mssdk.volces.com, reject
host-suffix, volces.com, reject

# === 图片类开屏广告(广告图直链请求，脚本删不掉) ===
# 取消下面注释即可屏蔽美柚自家广告素材域名
# host-suffix, ad.meiyou.com, reject
# host-suffix, adx.meiyou.com, reject

# === 备用: 用户启动期「网络活动」里出现的另一第三方域，带 axxd 广告路径前缀 ===
# 已启用尝试；若启用后美柚出现功能异常(推送/统计/加载变慢)，说明这是美柚自家域，立刻把这行加回 # 注释回退
host-suffix, axxd.xmseeyouyima.com, reject

# === 通用移动广告/统计 SDK（高置信，纯广告或监控用途，reject 不影响正常功能）===
# 用于覆盖偶发漏网：部分开屏广告走第三方广告 SDK 而非美柚自家域
host-suffix, pangle.cn, reject
host-suffix, umeng.com, reject

[rewrite_local]
^https?:\/\/.*\.meiyou\.com\/ url script-response-body https://raw.githubusercontent.com/fdkdk/adb/main/meiyou_ads.js
