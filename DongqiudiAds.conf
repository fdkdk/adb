# ============================================================
# 懂球帝 Dongqiudi 开屏/信息流广告屏蔽 — 独立订阅（不影响任何其他 App）
# 本配置只作用于 *.dongqiudi.com，与其他订阅(微博/美柚/开屏大杂烩)并存互不干扰
# 配套脚本: https://raw.githubusercontent.com/fdkdk/adb/main/dongqiudi_ads.js
# 订阅地址: https://raw.githubusercontent.com/fdkdk/adb/main/DongqiudiAds.conf
# 使用: QX → 重写 → 引用(订阅) → + → 类型选「配置文件」→ 填上面订阅地址 → 保存
# 注意: 本独立订阅与大杂烩 StartUp_NoWeibo.conf 二选一即可，已抽离避免重复/互相干扰
# ============================================================

[mitm]
hostname = api.dongqiudi.com, *.dongqiudi.com

[filter_local]
host-suffix, ad.dongqiudi.com, reject
host-suffix, adx.dongqiudi.com, reject
host-suffix, log.dongqiudi.com, reject

# === 通用移动广告/统计 SDK（高置信，纯广告或监控用途，reject 不影响正常功能）===
# 用于覆盖偶发漏网：部分开屏广告走第三方广告 SDK 而非懂球帝自家域
host-suffix, pangle.cn, reject
host-suffix, umeng.com, reject

[rewrite_local]
^https?:\/\/api\.dongqiudi\.com\/ url script-response-body https://raw.githubusercontent.com/fdkdk/adb/main/dongqiudi_ads.js
