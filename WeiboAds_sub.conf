// ==UserScript==
// @ScriptName        微博 & 微博国际版净化[墨鱼版 · 修复]
// @Origin            @ddgksf2013 / @zmqcherish（原作）
// @Patched           2026-08-09  by WorkBuddy
// @BaseVersion       conf V2.0.114 (2025-12-12) + weibo_json.js V2.0.142 (2025-09-15)
// @Fix1              国际版规则前置：原版 cardlist 通配规则抢先命中，导致国际版 reject-dict 永远失效
// @Fix2              国际版正则不再写死参数顺序，兼容 portal.php?ct=feed&a=xxx
// @Fix3              脚本改为 CDN(jsdelivr)引用，规避 raw.githubusercontent.com 拉取失败；订阅版免维护
// @Fix4              hostname 补全 boot/weibointl 通配
// @Attention         必须关闭 QuantumultX 的[兼容性增强]开关，否则微博去广告一定不生效
// ==/UserScript==


/* ============================================================
 * 用法（QuantumultX · 远程订阅版）
 * ---------------------------------------------------------------
 * 本文件 + weibo_json_fixed.js 都需要放进你自己的 GitHub 仓库
 * （同一仓库根目录即可），然后只做两件事：
 *
 * [A] 一次性替换占位符
 *     把全文里的  fdkdk/adb  全部替换成你自己的 用户名/仓库名
 *     （注意是一次性“替换全部”，约 24 处，1 秒搞定）
 *     例：你仓库地址是 github.com/XiaoMing/adb  -> 替换成 XiaoMing/adb
 *     分支若是 master 而不是 main，把 @main 也改成 @master
 *
 * [B] 在 QX 里订阅本配置
 *     QX -> 右下角“圈X” -> 重写 -> 引用(订阅) -> 右上角“+”
 *     -> 类型选“配置文件” -> 填入下面这个订阅地址：
 *        https://cdn.jsdelivr.net/gh/你的用户名/你的仓库名@main/WeiboAds_sub.conf
 *     -> 保存并开启
 *
 * 之后脚本与规则都走 CDN 自动更新，免维护。
 * 若要临时改某条规则：直接改仓库里的文件，QX 按订阅周期自动拉取。
 * ---------------------------------------------------------------
 * 重要开关（不关广告一定去不掉）：
 *   1. 关掉 QX 的 [兼容性增强]（设置里）
 *   2. 开 [阻止 QUIC]（或保留本配置里的 reject-quic 两行）
 *   3. 订阅后重启 QX、重新信任证书，微博杀后台重开
 * ============================================================ */


[mitm]
hostname = api.weibo.*, *.api.weibo.*, weibointl.api.weibo.*, mapi.weibo.*, *.uve.weibo.com, new.vip.weibo.cn, boot.biz.weibo.com, *.biz.weibo.com


[filter_local]
# > 微博_必须直连，否则 sdk 请求异常
host, sdkapp.uve.weibo.com, direct
# > 微博_广告策略
host, adstrategy.biz.weibo.com, reject
# > 微博国际版_开屏广告 SDK
host-suffix, api.touch-moblie.com, reject
# > 关键：微博走 HTTP/3，不阻断 QUIC 会导致 MITM 完全抓不到包（脚本"装了没反应"的头号原因）
#   QX 设置里已有"阻止 QUIC"开关的，优先用那个开关
host-suffix, weibo.cn, reject-quic
host-suffix, weibo.com, reject-quic


[rewrite_local]

# ======================================================== #
# =============== 微博国际版（必须放在最前）=============== #
# ======================================================== #
# 说明：原版把这条放在国内版 cardlist 通配规则之后，QX 取首个匹配，
#      导致 v_f=...Weibo_intl 永远被国内版规则吃掉，趋势页"热门影片"去不干净。
# > 微博国际版_趋势页热门影片（想恢复就在本行末尾加 #out=v_f）
^https?:\/\/api\.weibo\.cn\/\d\/cardlist\?v_f=.*Weibo_intl url reject-dict

# > 微博国际版_热推荐
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/ad\/weibointl\? url reject-dict

# > 微博国际版_hot_search_users
^https?:\/\/weibointl\.api\.weibo\.c(n|om)\/portal\.php\?(.*&)?a=hot_search_users url reject-dict

# > 微博国际版_搜索框填充词
^https?:\/\/weibointl\.api\.weibo\.c(n|om)\/portal\.php\?(.*&)?a=get_searching_info url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js

# > 微博国际版_探索页话题卡（返回空 data）
#   注意：这条会把探索页的话题卡整块清空。若你出现"热搜页/探索页空白"，
#         把本行注释掉，交给下面那条 a=search_topic 走脚本按需删广告即可。
^https?:\/\/weibointl\.api\.weibo\.c(n|om)\/portal\.php\?(.*&)?ct=feed&a=search_topic url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js

# > 微博国际版_热搜列表去广告（保留热搜内容，只删 searchtop / trending_topic）
^https?:\/\/weibointl\.api\.weibo\.c(n|om)\/portal\.php\?(.*&)?a=search_topic url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js

# > 微博国际版_开屏广告
^https?:\/\/weibointl\.api\.weibo\.c(n|om)\/portal\.php\?(.*&)?a=get_coopen_ads url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js

# > 微博国际版_趋势页顶部 Card
^https?:\/\/weibointl\.api\.weibo\.c(n|om)\/portal\.php\?(.*&)?a=trends url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js

# > 微博国际版_个人页 VIP 栏
^https?:\/\/weibointl\.api\.weibo\.c(n|om)\/portal\.php\?(.*&)?a=user_center url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js

# > 微博国际版_帖子详情页底部 banner 广告
^https?:\/\/weibointl\.api\.weibo\.c(n|om)\/portal\.php\?(.*&)?a=open_app url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js

# > 微博国际版_SDK 开屏广告
^https?:\/\/(sdk|wb)app\.uve\.weibo\.com(\/interface\/sdk\/sdkad\.php|\/wbapplua\/wbpullad\.lua) url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js

# > 微博国际版_应用内弹窗广告
^https?:\/\/(preload-click|preload-impression)\.uve\.weibo\.com\/(interface\/wbpullad\/wbpullad_click\.php|wbapplua\/get_wbpullad_log\.lua) url reject
# > 微博国际版_sdkconfig
^https?:\/\/sdkapp\.uve\.weibo\.com\/interface\/sdk\/sdkconfig\.php url reject


# ======================================================== #
# ===================== 微博国内版 ======================= #
# ======================================================== #
# > 微博_详情页及评论区
^https?:\/\/api\.weibo\.cn\/\d\/statuses\/container_detail url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js
# > 微博_首页信息流可能感兴趣推广
^https?:\/\/api\.weibo\.cn\/\d\/statuses\/container_positive url reject-200
# > 微博_首页顶部弹窗
^https?:\/\/api\.weibo\.cn\/\d\/push\/info url reject-200
# > 微博_删除侧栏视频流
^https?:\/\/api\.weibo\.cn\/\d\/ug\/checkin\/stream url jsonjq-response-body '.items |= map(select(.category != "card"))'
# > 微博_启动感兴趣弹窗
^https?:\/\/api\.weibo\.cn\/.*account\/recommend_interesttags url reject-dict
# > 微博_首页顶部直播推荐Tab
^https?:\/\/api\.weibo\.cn\/.*\/media_homelist url reject-200
# > 微博_搜索页默认填充词
^https?:\/\/api\.weibo\.cn\/.*finder\/searchbarchange url reject-200
# > 微博_AD_Preload
^https?:\/\/api\.weibo\.cn\/\d\/ad\/preload url reject-dict
# > 微博_首页顶部 homeExtend
^https?:\/\/api\.weibo\.cn\/\d\/groups\/allgroups\/v\d url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js
# > 微博_用户推荐弹窗
^https?:\/\/api\.weibo\.cn\/\d\/profile\/recommend_popuser url reject-dict
# > 微博_开屏广告预加载
^https?:\/\/boot.*weibo\.com\/v\d\/ad\/preload url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js
# > 微博_每日一次的开屏广告请求
^https?:\/\/boot.*weibo\.com\/v\d\/ad\/realtime url reject-200
# > 微博_未登录状态首页信息流
^https?:\/\/api\.weibo\.cn\/\d\/\w{5}\/(statuses_unread_hot_timeline|timeline) url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js
# > 微博_视频信息处理
^https?:\/\/api\.weibo\.cn\/\d\/video\/tiny_stream_mid_detail url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js
# > 微博_底部超话栏浮 icon
^https?:\/\/api\.weibo\.cn\/.*discovery_home_bottom_getdotinfo url reject-dict
# > 微博_首页左上角每日弹窗 tips
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/push\/daily url reject-dict
# > 微博_Spotlight
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/hot\/hours_spotlight url reject-dict
# > 微博_自定义 tab 皮肤
^https?:\/\/api\.weibo\.cn\/2\/!\/client\/light_skin url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js
# > 微博_非会员设置 tab 皮肤
^https?:\/\/new\.vip\.weibo\.cn\/littleskin\/preview url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js
# > 微博_搜索页热词
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/\w{5}\/cardlist url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js
# > 微博_去广告及各推广模块
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/(searchall|page\?|0flowpage) url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/statuses\/(unread_)?friends(\/|_)timeline url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/groups\/timeline url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/statuses\/(container_timeline|unread_hot_timeline|extend|video_mixtimeline|unread_topic_timeline) url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/profile\/(me|container_timeline) url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/video\/(community_tab|remind_info|tiny_stream_video_list) url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/search\/(finder|container_timeline|container_discover) url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/(checkin\/show|\!\/live\/media_homelist|container\/get_item) url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/cardlist url script-response-body https://cdn.jsdelivr.net/gh/fdkdk/adb@main/weibo_json_fixed.js
